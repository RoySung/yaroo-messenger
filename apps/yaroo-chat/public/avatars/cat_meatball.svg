<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="32" height="32" fill="#E8E0F0"/>
  <rect width="32" height="16" fill="#D0C8E0"/>
  
  <!-- Sparkles -->
  <rect x="4" y="4" width="1" height="1" fill="#FFE066"/>
  <rect x="3" y="5" width="1" height="1" fill="#FFE066"/>
  <rect x="5" y="5" width="1" height="1" fill="#FFE066"/>
  <rect x="4" y="6" width="1" height="1" fill="#FFE066"/>
  
  <!-- Ears - calico pattern -->
  <rect x="7" y="4" width="2" height="1" fill="#F4A859"/>
  <rect x="6" y="5" width="1" height="1" fill="#F4A859"/>
  <rect x="7" y="5" width="2" height="1" fill="#FFFFFF"/>
  <rect x="9" y="5" width="1" height="1" fill="#F4A859"/>
  <rect x="6" y="6" width="1" height="1" fill="#F4A859"/>
  <rect x="7" y="6" width="1" height="1" fill="#FFB6C1"/>
  <rect x="8" y="6" width="1" height="1" fill="#FFFFFF"/>
  <rect x="9" y="6" width="1" height="1" fill="#F4A859"/>
  
  <rect x="22" y="4" width="2" height="1" fill="#404040"/>
  <rect x="21" y="5" width="1" height="1" fill="#404040"/>
  <rect x="22" y="5" width="2" height="1" fill="#606060"/>
  <rect x="24" y="5" width="1" height="1" fill="#404040"/>
  <rect x="21" y="6" width="1" height="1" fill="#404040"/>
  <rect x="22" y="6" width="1" height="1" fill="#606060"/>
  <rect x="23" y="6" width="1" height="1" fill="#FFB6C1"/>
  <rect x="24" y="6" width="1" height="1" fill="#404040"/>

  <!-- Head -->
  <rect x="8" y="7" width="16" height="1" fill="#C0C0C0"/>
  <rect x="7" y="8" width="1" height="1" fill="#C0C0C0"/>
  <rect x="8" y="8" width="8" height="1" fill="#FFFFFF"/>
  <rect x="16" y="8" width="8" height="1" fill="#FFFFFF"/>
  <rect x="24" y="8" width="1" height="1" fill="#C0C0C0"/>
  
  <rect x="6" y="9" width="1" height="1" fill="#C0C0C0"/>
  <rect x="7" y="9" width="18" height="1" fill="#FFFFFF"/>
  <rect x="25" y="9" width="1" height="1" fill="#C0C0C0"/>
  
  <rect x="5" y="10" width="1" height="8" fill="#C0C0C0"/>
  <rect x="6" y="10" width="20" height="8" fill="#FFFFFF"/>
  <rect x="26" y="10" width="1" height="8" fill="#C0C0C0"/>

  <!-- Calico patches -->
  <rect x="8" y="8" width="3" height="3" fill="#F4A859"/>
  <rect x="20" y="8" width="4" height="3" fill="#505050"/>
  <rect x="7" y="9" width="2" height="2" fill="#F4A859"/>

  <!-- Glasses frames -->
  <rect x="8" y="11" width="6" height="1" fill="#8B6914"/>
  <rect x="8" y="14" width="6" height="1" fill="#8B6914"/>
  <rect x="8" y="11" width="1" height="4" fill="#8B6914"/>
  <rect x="13" y="11" width="1" height="4" fill="#8B6914"/>
  <rect x="14" y="12" width="4" height="1" fill="#8B6914"/>
  <rect x="18" y="11" width="6" height="1" fill="#8B6914"/>
  <rect x="18" y="14" width="6" height="1" fill="#8B6914"/>
  <rect x="18" y="11" width="1" height="4" fill="#8B6914"/>
  <rect x="23" y="11" width="1" height="4" fill="#8B6914"/>

  <!-- Eyes behind glasses -->
  <rect x="9" y="12" width="4" height="2" fill="#D0E8FF"/>
  <rect x="10" y="12" width="2" height="1" fill="#2C5F8A"/>
  <rect x="11" y="12" width="1" height="1" fill="#FFFFFF"/>
  
  <rect x="19" y="12" width="4" height="2" fill="#D0E8FF"/>
  <rect x="20" y="12" width="2" height="1" fill="#2C5F8A"/>
  <rect x="21" y="12" width="1" height="1" fill="#FFFFFF"/>

  <!-- Nose -->
  <rect x="15" y="15" width="2" height="1" fill="#FFB6C1"/>

  <!-- Cute mouth -->
  <rect x="14" y="16" width="1" height="1" fill="#C0A0A0"/>
  <rect x="17" y="16" width="1" height="1" fill="#C0A0A0"/>

  <!-- Cheek blush -->
  <rect x="7" y="15" width="2" height="1" fill="#FFB6C1" opacity="0.5"/>
  <rect x="23" y="15" width="2" height="1" fill="#FFB6C1" opacity="0.5"/>

  <!-- Whiskers -->
  <rect x="3" y="14" width="4" height="1" fill="#C0C0C0" opacity="0.5"/>
  <rect x="3" y="16" width="4" height="1" fill="#C0C0C0" opacity="0.5"/>
  <rect x="25" y="14" width="4" height="1" fill="#C0C0C0" opacity="0.5"/>
  <rect x="25" y="16" width="4" height="1" fill="#C0C0C0" opacity="0.5"/>

  <!-- Bottom of head -->
  <rect x="6" y="18" width="1" height="1" fill="#C0C0C0"/>
  <rect x="7" y="18" width="18" height="1" fill="#FFFFFF"/>
  <rect x="25" y="18" width="1" height="1" fill="#C0C0C0"/>
  <rect x="7" y="19" width="1" height="1" fill="#C0C0C0"/>
  <rect x="8" y="19" width="16" height="1" fill="#FFFFFF"/>
  <rect x="24" y="19" width="1" height="1" fill="#C0C0C0"/>
  <rect x="8" y="20" width="16" height="1" fill="#C0C0C0"/>

  <!-- Body - yellow top -->
  <rect x="6" y="21" width="20" height="1" fill="#D4A020"/>
  <rect x="5" y="22" width="22" height="1" fill="#E8B830"/>
  <rect x="4" y="23" width="24" height="9" fill="#E8B830"/>
  
  <!-- Collar -->
  <rect x="13" y="21" width="6" height="1" fill="#FFFFFF"/>
  <rect x="14" y="22" width="4" height="1" fill="#FFFFFF"/>
  <rect x="15" y="22" width="2" height="1" fill="#4169E1"/>
</svg>

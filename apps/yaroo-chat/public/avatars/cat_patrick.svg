<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="32" height="32" fill="#D0E8FF"/>
  
  <!-- Stars decoration -->
  <rect x="3" y="3" width="1" height="1" fill="#FFE066"/>
  <rect x="27" y="5" width="1" height="1" fill="#FFE066"/>
  <rect x="4" y="8" width="1" height="1" fill="#FFE066"/>

  <!-- Ears - Scottish Fold style (folded) -->
  <rect x="7" y="5" width="3" height="1" fill="#B08050"/>
  <rect x="6" y="6" width="5" height="1" fill="#C89868"/>
  <rect x="7" y="7" width="3" height="1" fill="#C89868"/>
  
  <rect x="21" y="5" width="3" height="1" fill="#B08050"/>
  <rect x="20" y="6" width="5" height="1" fill="#C89868"/>
  <rect x="21" y="7" width="3" height="1" fill="#C89868"/>

  <!-- Head -->
  <rect x="8" y="7" width="16" height="1" fill="#906830"/>
  <rect x="7" y="8" width="1" height="1" fill="#906830"/>
  <rect x="8" y="8" width="16" height="1" fill="#C89868"/>
  <rect x="24" y="8" width="1" height="1" fill="#906830"/>
  
  <rect x="6" y="9" width="1" height="1" fill="#906830"/>
  <rect x="7" y="9" width="18" height="1" fill="#C89868"/>
  <rect x="25" y="9" width="1" height="1" fill="#906830"/>
  
  <rect x="5" y="10" width="1" height="8" fill="#906830"/>
  <rect x="6" y="10" width="20" height="8" fill="#C89868"/>
  <rect x="26" y="10" width="1" height="8" fill="#906830"/>

  <!-- Tabby markings on forehead -->
  <rect x="12" y="8" width="1" height="2" fill="#906830"/>
  <rect x="15" y="8" width="2" height="1" fill="#906830"/>
  <rect x="19" y="8" width="1" height="2" fill="#906830"/>
  <rect x="14" y="9" width="1" height="1" fill="#906830"/>
  <rect x="17" y="9" width="1" height="1" fill="#906830"/>

  <!-- White face -->
  <rect x="10" y="13" width="12" height="1" fill="#FFF5E6"/>
  <rect x="9" y="14" width="14" height="1" fill="#FFF5E6"/>
  <rect x="9" y="15" width="14" height="1" fill="#FFF5E6"/>
  <rect x="10" y="16" width="12" height="1" fill="#FFF5E6"/>

  <!-- Eyes - big round and mischievous -->
  <rect x="9" y="10" width="4" height="3" fill="#FFFFFF"/>
  <rect x="10" y="10" width="2" height="2" fill="#C8A030"/>
  <rect x="11" y="10" width="1" height="1" fill="#FFFFFF"/>
  
  <rect x="19" y="10" width="4" height="3" fill="#FFFFFF"/>
  <rect x="20" y="10" width="2" height="2" fill="#C8A030"/>
  <rect x="21" y="10" width="1" height="1" fill="#FFFFFF"/>

  <!-- Nose -->
  <rect x="15" y="13" width="2" height="1" fill="#FFB6C1"/>

  <!-- Cheeky grin -->
  <rect x="13" y="14" width="1" height="1" fill="#906830"/>
  <rect x="14" y="15" width="4" height="1" fill="#906830"/>
  <rect x="18" y="14" width="1" height="1" fill="#906830"/>

  <!-- Whiskers -->
  <rect x="3" y="12" width="5" height="1" fill="#906830" opacity="0.5"/>
  <rect x="3" y="14" width="5" height="1" fill="#906830" opacity="0.5"/>
  <rect x="24" y="12" width="5" height="1" fill="#906830" opacity="0.5"/>
  <rect x="24" y="14" width="5" height="1" fill="#906830" opacity="0.5"/>

  <!-- Bottom of head -->
  <rect x="6" y="18" width="1" height="1" fill="#906830"/>
  <rect x="7" y="18" width="18" height="1" fill="#C89868"/>
  <rect x="25" y="18" width="1" height="1" fill="#906830"/>
  <rect x="7" y="19" width="1" height="1" fill="#906830"/>
  <rect x="8" y="19" width="16" height="1" fill="#C89868"/>
  <rect x="24" y="19" width="1" height="1" fill="#906830"/>
  <rect x="8" y="20" width="16" height="1" fill="#906830"/>

  <!-- Body - casual hoodie -->
  <rect x="6" y="21" width="20" height="1" fill="#4A90C8"/>
  <rect x="5" y="22" width="22" height="1" fill="#5AA0D8"/>
  <rect x="4" y="23" width="24" height="9" fill="#5AA0D8"/>
  
  <!-- Hoodie pocket -->
  <rect x="11" y="25" width="10" height="3" fill="#4A90C8"/>
</svg>

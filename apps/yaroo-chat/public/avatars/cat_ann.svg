<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="32" height="32" fill="#C8F0C8"/>
  
  <!-- Ears - tuxedo cat -->
  <rect x="7" y="4" width="2" height="1" fill="#303030"/>
  <rect x="6" y="5" width="1" height="1" fill="#303030"/>
  <rect x="7" y="5" width="2" height="1" fill="#404040"/>
  <rect x="9" y="5" width="1" height="1" fill="#303030"/>
  <rect x="6" y="6" width="1" height="1" fill="#303030"/>
  <rect x="7" y="6" width="1" height="1" fill="#FFB6C1"/>
  <rect x="8" y="6" width="1" height="1" fill="#404040"/>
  <rect x="9" y="6" width="1" height="1" fill="#303030"/>
  
  <rect x="22" y="4" width="2" height="1" fill="#303030"/>
  <rect x="21" y="5" width="1" height="1" fill="#303030"/>
  <rect x="22" y="5" width="2" height="1" fill="#404040"/>
  <rect x="24" y="5" width="1" height="1" fill="#303030"/>
  <rect x="21" y="6" width="1" height="1" fill="#303030"/>
  <rect x="22" y="6" width="1" height="1" fill="#404040"/>
  <rect x="23" y="6" width="1" height="1" fill="#FFB6C1"/>
  <rect x="24" y="6" width="1" height="1" fill="#303030"/>

  <!-- Head -->
  <rect x="8" y="7" width="16" height="1" fill="#202020"/>
  <rect x="7" y="8" width="1" height="1" fill="#202020"/>
  <rect x="8" y="8" width="16" height="1" fill="#404040"/>
  <rect x="24" y="8" width="1" height="1" fill="#202020"/>
  
  <rect x="6" y="9" width="1" height="1" fill="#202020"/>
  <rect x="7" y="9" width="18" height="1" fill="#404040"/>
  <rect x="25" y="9" width="1" height="1" fill="#202020"/>
  
  <rect x="5" y="10" width="1" height="8" fill="#202020"/>
  <rect x="6" y="10" width="20" height="8" fill="#404040"/>
  <rect x="26" y="10" width="1" height="8" fill="#202020"/>

  <!-- White tuxedo face markings -->
  <rect x="12" y="9" width="8" height="1" fill="#FFFFFF"/>
  <rect x="11" y="10" width="10" height="1" fill="#FFFFFF"/>
  <rect x="10" y="11" width="12" height="7" fill="#FFFFFF"/>

  <!-- Eyes - round and cute -->
  <rect x="9" y="11" width="4" height="3" fill="#FFFFFF"/>
  <rect x="10" y="11" width="2" height="2" fill="#2E8B57"/>
  <rect x="11" y="11" width="1" height="1" fill="#FFFFFF"/>
  
  <rect x="19" y="11" width="4" height="3" fill="#FFFFFF"/>
  <rect x="20" y="11" width="2" height="2" fill="#2E8B57"/>
  <rect x="21" y="11" width="1" height="1" fill="#FFFFFF"/>

  <!-- Nose -->
  <rect x="15" y="14" width="2" height="1" fill="#FF9999"/>

  <!-- Mouth -->
  <rect x="14" y="15" width="1" height="1" fill="#808080"/>
  <rect x="17" y="15" width="1" height="1" fill="#808080"/>
  <rect x="15" y="16" width="2" height="1" fill="#808080"/>

  <!-- Whiskers -->
  <rect x="3" y="13" width="5" height="1" fill="#606060" opacity="0.5"/>
  <rect x="3" y="15" width="5" height="1" fill="#606060" opacity="0.5"/>
  <rect x="24" y="13" width="5" height="1" fill="#606060" opacity="0.5"/>
  <rect x="24" y="15" width="5" height="1" fill="#606060" opacity="0.5"/>

  <!-- Bottom of head -->
  <rect x="6" y="18" width="1" height="1" fill="#202020"/>
  <rect x="7" y="18" width="18" height="1" fill="#404040"/>
  <rect x="25" y="18" width="1" height="1" fill="#202020"/>
  <rect x="7" y="19" width="1" height="1" fill="#202020"/>
  <rect x="8" y="19" width="16" height="1" fill="#404040"/>
  <rect x="24" y="19" width="1" height="1" fill="#202020"/>
  <rect x="8" y="20" width="16" height="1" fill="#202020"/>

  <!-- White chest -->
  <rect x="12" y="18" width="8" height="2" fill="#FFFFFF"/>

  <!-- Body -->
  <rect x="6" y="21" width="20" height="1" fill="#2B5F2B"/>
  <rect x="5" y="22" width="22" height="1" fill="#3A7A3A"/>
  <rect x="4" y="23" width="24" height="9" fill="#3A7A3A"/>
</svg>

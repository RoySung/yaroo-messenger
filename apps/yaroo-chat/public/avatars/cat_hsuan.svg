<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="32" height="32" fill="#F0D0E8"/>
  <rect width="32" height="16" fill="#DCC0F0"/>
  
  <!-- Sparkle decorations -->
  <rect x="3" y="3" width="1" height="1" fill="#FFE066"/>
  <rect x="2" y="4" width="1" height="1" fill="#FFE066"/>
  <rect x="4" y="4" width="1" height="1" fill="#FFE066"/>
  <rect x="3" y="5" width="1" height="1" fill="#FFE066"/>
  <rect x="27" y="4" width="2" height="1" fill="#FFFFFF"/>
  <rect x="28" y="3" width="1" height="2" fill="#FFFFFF"/>
  
  <!-- Ears -->
  <rect x="7" y="4" width="2" height="1" fill="#E0E0E0"/>
  <rect x="6" y="5" width="1" height="1" fill="#E0E0E0"/>
  <rect x="7" y="5" width="2" height="1" fill="#FFFFFF"/>
  <rect x="9" y="5" width="1" height="1" fill="#E0E0E0"/>
  <rect x="6" y="6" width="1" height="1" fill="#E0E0E0"/>
  <rect x="7" y="6" width="1" height="1" fill="#FFB6C1"/>
  <rect x="8" y="6" width="1" height="1" fill="#FFFFFF"/>
  <rect x="9" y="6" width="1" height="1" fill="#E0E0E0"/>
  
  <rect x="22" y="4" width="2" height="1" fill="#E0E0E0"/>
  <rect x="21" y="5" width="1" height="1" fill="#E0E0E0"/>
  <rect x="22" y="5" width="2" height="1" fill="#FFFFFF"/>
  <rect x="24" y="5" width="1" height="1" fill="#E0E0E0"/>
  <rect x="21" y="6" width="1" height="1" fill="#E0E0E0"/>
  <rect x="22" y="6" width="1" height="1" fill="#FFFFFF"/>
  <rect x="23" y="6" width="1" height="1" fill="#FFB6C1"/>
  <rect x="24" y="6" width="1" height="1" fill="#E0E0E0"/>

  <!-- Head -->
  <rect x="8" y="7" width="16" height="1" fill="#D0D0D0"/>
  <rect x="7" y="8" width="1" height="1" fill="#D0D0D0"/>
  <rect x="8" y="8" width="16" height="1" fill="#FFFFFF"/>
  <rect x="24" y="8" width="1" height="1" fill="#D0D0D0"/>
  
  <rect x="6" y="9" width="1" height="1" fill="#D0D0D0"/>
  <rect x="7" y="9" width="18" height="1" fill="#FFFFFF"/>
  <rect x="25" y="9" width="1" height="1" fill="#D0D0D0"/>
  
  <rect x="5" y="10" width="1" height="7" fill="#D0D0D0"/>
  <rect x="6" y="10" width="20" height="7" fill="#FFFFFF"/>
  <rect x="26" y="10" width="1" height="7" fill="#D0D0D0"/>

  <!-- Eyes - big sparkly -->
  <rect x="8" y="11" width="4" height="4" fill="#FFFFFF"/>
  <rect x="9" y="11" width="3" height="3" fill="#6B4C8A"/>
  <rect x="10" y="11" width="1" height="1" fill="#FFFFFF"/>
  <rect x="9" y="13" width="1" height="1" fill="#FFB6C1"/>
  
  <rect x="20" y="11" width="4" height="4" fill="#FFFFFF"/>
  <rect x="20" y="11" width="3" height="3" fill="#6B4C8A"/>
  <rect x="21" y="11" width="1" height="1" fill="#FFFFFF"/>
  <rect x="20" y="13" width="1" height="1" fill="#FFB6C1"/>

  <!-- Nose -->
  <rect x="15" y="14" width="2" height="1" fill="#FFB6C1"/>

  <!-- Mouth - cute smile -->
  <rect x="14" y="15" width="1" height="1" fill="#D0A0B0"/>
  <rect x="17" y="15" width="1" height="1" fill="#D0A0B0"/>

  <!-- Cheek blush -->
  <rect x="7" y="14" width="2" height="2" fill="#FFB6C1" opacity="0.5"/>
  <rect x="23" y="14" width="2" height="2" fill="#FFB6C1" opacity="0.5"/>

  <!-- Whiskers -->
  <rect x="3" y="13" width="4" height="1" fill="#D0D0D0" opacity="0.6"/>
  <rect x="3" y="15" width="4" height="1" fill="#D0D0D0" opacity="0.6"/>
  <rect x="25" y="13" width="4" height="1" fill="#D0D0D0" opacity="0.6"/>
  <rect x="25" y="15" width="4" height="1" fill="#D0D0D0" opacity="0.6"/>

  <!-- Bottom of head -->
  <rect x="6" y="17" width="1" height="1" fill="#D0D0D0"/>
  <rect x="7" y="17" width="18" height="1" fill="#FFFFFF"/>
  <rect x="25" y="17" width="1" height="1" fill="#D0D0D0"/>
  <rect x="7" y="18" width="1" height="1" fill="#D0D0D0"/>
  <rect x="8" y="18" width="16" height="1" fill="#FFFFFF"/>
  <rect x="24" y="18" width="1" height="1" fill="#D0D0D0"/>
  <rect x="8" y="19" width="16" height="1" fill="#D0D0D0"/>

  <!-- Body - pink purple striped shirt -->
  <rect x="6" y="20" width="20" height="1" fill="#D8A0D0"/>
  <rect x="5" y="21" width="22" height="2" fill="#FFB0D0"/>
  <rect x="4" y="23" width="24" height="2" fill="#D8A0D0"/>
  <rect x="4" y="25" width="24" height="2" fill="#FFB0D0"/>
  <rect x="4" y="27" width="24" height="2" fill="#D8A0D0"/>
  <rect x="4" y="29" width="24" height="3" fill="#FFB0D0"/>

  <!-- Pixel heart decoration -->
  <rect x="26" y="18" width="1" height="1" fill="#FFFFFF"/>
  <rect x="28" y="18" width="1" height="1" fill="#FFFFFF"/>
  <rect x="25" y="19" width="5" height="1" fill="#FFFFFF"/>
  <rect x="26" y="20" width="3" height="1" fill="#FFFFFF"/>
  <rect x="27" y="21" width="1" height="1" fill="#FFFFFF"/>
</svg>

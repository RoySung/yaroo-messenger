<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 140" width="100%" height="100%">
  <defs>
    <!-- Purple ellipse gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B0099" />
      <stop offset="100%" stop-color="#4E0066" />
    </linearGradient>

    <!-- Smiley gradient -->
    <radialGradient id="smileyGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF580" />
      <stop offset="50%" stop-color="#FFD400" />
      <stop offset="100%" stop-color="#E5A800" />
    </radialGradient>

    <!-- Filter for slight drop shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Purple Oval Badge with Y! -->
  <g transform="translate(130, 20)">
    <!-- Purple Oval Background -->
    <ellipse cx="65" cy="50" rx="65" ry="46" fill="url(#purpleGrad)" filter="url(#dropShadow)" />
    
    <!-- White Y! Text -->
    <!-- Large serif Y -->
    <text x="35" y="68" 
          font-family="'Georgia', 'Times New Roman', 'Palatino', serif" 
          font-size="62" 
          font-weight="900" 
          fill="#FFFFFF" 
          text-anchor="middle"
          style="letter-spacing: -2px;">Y</text>
  </g>

  <!-- Large Exclamation Mark -->
  <g transform="translate(202, 35)">
    <polygon points="3,2 15,2 11,46 7,46" fill="#FFFFFF" />
    <circle cx="9" cy="58" r="5" fill="#FFFFFF" />
    <text x="16" y="58" font-family="Arial, sans-serif" font-size="9" fill="#FFFFFF" font-weight="bold">®</text>
  </g>

  <!-- Yellow Smiley Face (in foreground on left) -->
  <g transform="translate(10, 10)" filter="url(#dropShadow)">
    <!-- Face Circle -->
    <circle cx="60" cy="60" r="54" fill="url(#smileyGrad)" stroke="#5B330A" stroke-width="5.5" />
    
    <!-- Face Specular Highlight -->
    <ellipse cx="38" cy="32" rx="14" ry="7" fill="#FFFFFF" opacity="0.35" transform="rotate(-30, 38, 32)" />

    <!-- Left Eye -->
    <ellipse cx="43" cy="44" rx="4.5" ry="6.5" fill="#3D1E06" />
    
    <!-- Right Eye -->
    <ellipse cx="77" cy="44" rx="4.5" ry="6.5" fill="#3D1E06" />

    <!-- Open Happy Mouth -->
    <g id="mouth">
      <clipPath id="mouthClip">
        <path d="M 33 60 C 33 60, 40 92, 60 92 C 80 92, 87 60, 87 60 Z" />
      </clipPath>
      <!-- Mouth cavity -->
      <path d="M 33 60 C 33 60, 40 92, 60 92 C 80 92, 87 60, 87 60 Z" 
            fill="#4D1A0A" 
            stroke="#5B330A" 
            stroke-width="4.5" 
            stroke-linejoin="round" />
      
      <!-- Tongue inside mouth -->
      <path d="M 45 80 C 50 72, 70 72, 75 80 C 70 94, 50 94, 45 80 Z" 
            fill="#FF7E82" 
            clip-path="url(#mouthClip)" />
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="32" height="32" fill="#E8E0F0"/>
  <rect width="32" height="16" fill="#D8D0E8"/>
  
  <!-- Sparkle -->
  <rect x="26" y="3" width="1" height="1" fill="#FFE066"/>
  <rect x="25" y="4" width="1" height="1" fill="#FFE066"/>
  <rect x="27" y="4" width="1" height="1" fill="#FFE066"/>
  <rect x="26" y="5" width="1" height="1" fill="#FFE066"/>

  <!-- Ears -->
  <rect x="7" y="4" width="2" height="1" fill="#808080"/>
  <rect x="6" y="5" width="1" height="1" fill="#808080"/>
  <rect x="7" y="5" width="2" height="1" fill="#A0A0A0"/>
  <rect x="9" y="5" width="1" height="1" fill="#808080"/>
  <rect x="6" y="6" width="1" height="1" fill="#808080"/>
  <rect x="7" y="6" width="1" height="1" fill="#FFB6C1"/>
  <rect x="8" y="6" width="1" height="1" fill="#A0A0A0"/>
  <rect x="9" y="6" width="1" height="1" fill="#808080"/>
  
  <rect x="22" y="4" width="2" height="1" fill="#808080"/>
  <rect x="21" y="5" width="1" height="1" fill="#808080"/>
  <rect x="22" y="5" width="2" height="1" fill="#A0A0A0"/>
  <rect x="24" y="5" width="1" height="1" fill="#808080"/>
  <rect x="21" y="6" width="1" height="1" fill="#808080"/>
  <rect x="22" y="6" width="1" height="1" fill="#A0A0A0"/>
  <rect x="23" y="6" width="1" height="1" fill="#FFB6C1"/>
  <rect x="24" y="6" width="1" height="1" fill="#808080"/>

  <!-- Head -->
  <rect x="8" y="7" width="16" height="1" fill="#707070"/>
  <rect x="7" y="8" width="1" height="1" fill="#707070"/>
  <rect x="8" y="8" width="16" height="1" fill="#A0A0A0"/>
  <rect x="24" y="8" width="1" height="1" fill="#707070"/>
  
  <rect x="6" y="9" width="1" height="1" fill="#707070"/>
  <rect x="7" y="9" width="18" height="1" fill="#A0A0A0"/>
  <rect x="25" y="9" width="1" height="1" fill="#707070"/>
  
  <rect x="5" y="10" width="1" height="8" fill="#707070"/>
  <rect x="6" y="10" width="20" height="8" fill="#A0A0A0"/>
  <rect x="26" y="10" width="1" height="8" fill="#707070"/>

  <!-- Darker stripes on head -->
  <rect x="9" y="8" width="2" height="1" fill="#808080"/>
  <rect x="13" y="8" width="1" height="1" fill="#808080"/>
  <rect x="18" y="8" width="1" height="1" fill="#808080"/>
  <rect x="21" y="8" width="2" height="1" fill="#808080"/>
  <rect x="10" y="9" width="1" height="1" fill="#808080"/>
  <rect x="15" y="9" width="2" height="1" fill="#808080"/>
  <rect x="21" y="9" width="1" height="1" fill="#808080"/>

  <!-- White face -->
  <rect x="10" y="14" width="12" height="1" fill="#E8E8E8"/>
  <rect x="9" y="15" width="14" height="1" fill="#E8E8E8"/>
  <rect x="9" y="16" width="14" height="1" fill="#E8E8E8"/>
  <rect x="10" y="17" width="12" height="1" fill="#E8E8E8"/>

  <!-- Eyes - sleepy/chill -->
  <rect x="9" y="11" width="4" height="3" fill="#FFFFFF"/>
  <rect x="10" y="12" width="2" height="2" fill="#5C7A3A"/>
  <rect x="11" y="12" width="1" height="1" fill="#FFFFFF"/>
  <!-- Half closed eyelid -->
  <rect x="9" y="11" width="4" height="1" fill="#808080"/>
  
  <rect x="19" y="11" width="4" height="3" fill="#FFFFFF"/>
  <rect x="20" y="12" width="2" height="2" fill="#5C7A3A"/>
  <rect x="21" y="12" width="1" height="1" fill="#FFFFFF"/>
  <rect x="19" y="11" width="4" height="1" fill="#808080"/>

  <!-- Nose -->
  <rect x="15" y="14" width="2" height="1" fill="#C0C0C0"/>

  <!-- Relaxed mouth -->
  <rect x="15" y="15" width="2" height="1" fill="#808080"/>

  <!-- Whiskers -->
  <rect x="3" y="13" width="5" height="1" fill="#808080" opacity="0.5"/>
  <rect x="3" y="15" width="5" height="1" fill="#808080" opacity="0.5"/>
  <rect x="24" y="13" width="5" height="1" fill="#808080" opacity="0.5"/>
  <rect x="24" y="15" width="5" height="1" fill="#808080" opacity="0.5"/>

  <!-- Bottom of head -->
  <rect x="6" y="18" width="1" height="1" fill="#707070"/>
  <rect x="7" y="18" width="18" height="1" fill="#A0A0A0"/>
  <rect x="25" y="18" width="1" height="1" fill="#707070"/>
  <rect x="7" y="19" width="1" height="1" fill="#707070"/>
  <rect x="8" y="19" width="16" height="1" fill="#A0A0A0"/>
  <rect x="24" y="19" width="1" height="1" fill="#707070"/>
  <rect x="8" y="20" width="16" height="1" fill="#707070"/>

  <!-- Body -->
  <rect x="6" y="21" width="20" height="1" fill="#4A4A6A"/>
  <rect x="5" y="22" width="22" height="1" fill="#4A4A6A"/>
  <rect x="4" y="23" width="24" height="9" fill="#4A4A6A"/>
</svg>

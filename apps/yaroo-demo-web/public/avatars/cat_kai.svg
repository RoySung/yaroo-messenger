<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="32" height="32" fill="#FFE8C0"/>
  
  <!-- Ears -->
  <rect x="7" y="3" width="2" height="1" fill="#8B4513"/>
  <rect x="6" y="4" width="1" height="1" fill="#8B4513"/>
  <rect x="7" y="4" width="2" height="1" fill="#CD853F"/>
  <rect x="9" y="4" width="1" height="1" fill="#8B4513"/>
  <rect x="6" y="5" width="1" height="1" fill="#8B4513"/>
  <rect x="7" y="5" width="1" height="1" fill="#FFB6C1"/>
  <rect x="8" y="5" width="1" height="1" fill="#CD853F"/>
  <rect x="9" y="5" width="1" height="1" fill="#8B4513"/>
  
  <rect x="22" y="3" width="2" height="1" fill="#8B4513"/>
  <rect x="21" y="4" width="1" height="1" fill="#8B4513"/>
  <rect x="22" y="4" width="2" height="1" fill="#CD853F"/>
  <rect x="24" y="4" width="1" height="1" fill="#8B4513"/>
  <rect x="21" y="5" width="1" height="1" fill="#8B4513"/>
  <rect x="22" y="5" width="1" height="1" fill="#CD853F"/>
  <rect x="23" y="5" width="1" height="1" fill="#FFB6C1"/>
  <rect x="24" y="5" width="1" height="1" fill="#8B4513"/>

  <!-- Head -->
  <rect x="8" y="6" width="16" height="1" fill="#6B3410"/>
  <rect x="7" y="7" width="1" height="1" fill="#6B3410"/>
  <rect x="8" y="7" width="16" height="1" fill="#CD853F"/>
  <rect x="24" y="7" width="1" height="1" fill="#6B3410"/>
  
  <rect x="6" y="8" width="1" height="1" fill="#6B3410"/>
  <rect x="7" y="8" width="18" height="1" fill="#CD853F"/>
  <rect x="25" y="8" width="1" height="1" fill="#6B3410"/>
  
  <rect x="5" y="9" width="1" height="8" fill="#6B3410"/>
  <rect x="6" y="9" width="20" height="8" fill="#CD853F"/>
  <rect x="26" y="9" width="1" height="8" fill="#6B3410"/>

  <!-- Dark patches on face -->
  <rect x="8" y="7" width="3" height="2" fill="#8B4513"/>
  <rect x="21" y="7" width="3" height="2" fill="#8B4513"/>

  <!-- White face/chin area -->
  <rect x="11" y="13" width="10" height="1" fill="#FFF5E6"/>
  <rect x="10" y="14" width="12" height="1" fill="#FFF5E6"/>
  <rect x="10" y="15" width="12" height="1" fill="#FFF5E6"/>
  <rect x="11" y="16" width="10" height="1" fill="#FFF5E6"/>

  <!-- Eyes - determined -->
  <rect x="9" y="10" width="4" height="3" fill="#FFFFFF"/>
  <rect x="10" y="10" width="2" height="2" fill="#2C3E50"/>
  <rect x="11" y="10" width="1" height="1" fill="#FFFFFF"/>
  
  <rect x="19" y="10" width="4" height="3" fill="#FFFFFF"/>
  <rect x="20" y="10" width="2" height="2" fill="#2C3E50"/>
  <rect x="21" y="10" width="1" height="1" fill="#FFFFFF"/>

  <!-- Angry/determined brows -->
  <rect x="8" y="9" width="5" height="1" fill="#6B3410"/>
  <rect x="19" y="9" width="5" height="1" fill="#6B3410"/>

  <!-- Nose -->
  <rect x="15" y="13" width="2" height="1" fill="#FF9999"/>

  <!-- Determined mouth -->
  <rect x="13" y="14" width="6" height="1" fill="#8B4513"/>
  <rect x="14" y="15" width="1" height="1" fill="#8B4513"/>
  <rect x="17" y="15" width="1" height="1" fill="#8B4513"/>

  <!-- Whiskers -->
  <rect x="3" y="12" width="5" height="1" fill="#8B4513" opacity="0.5"/>
  <rect x="3" y="14" width="5" height="1" fill="#8B4513" opacity="0.5"/>
  <rect x="24" y="12" width="5" height="1" fill="#8B4513" opacity="0.5"/>
  <rect x="24" y="14" width="5" height="1" fill="#8B4513" opacity="0.5"/>

  <!-- Bottom of head -->
  <rect x="6" y="17" width="1" height="1" fill="#6B3410"/>
  <rect x="7" y="17" width="18" height="1" fill="#CD853F"/>
  <rect x="25" y="17" width="1" height="1" fill="#6B3410"/>
  <rect x="7" y="18" width="1" height="1" fill="#6B3410"/>
  <rect x="8" y="18" width="16" height="1" fill="#CD853F"/>
  <rect x="24" y="18" width="1" height="1" fill="#6B3410"/>
  <rect x="8" y="19" width="16" height="1" fill="#6B3410"/>

  <!-- Body - red headband warrior style -->
  <rect x="6" y="20" width="20" height="1" fill="#B22222"/>
  <rect x="5" y="21" width="22" height="1" fill="#CC3333"/>
  <rect x="4" y="22" width="24" height="10" fill="#CC3333"/>
  
  <!-- Headband -->
  <rect x="5" y="7" width="22" height="1" fill="#FF4444"/>
  <rect x="3" y="8" width="3" height="1" fill="#FF4444"/>
  <rect x="26" y="8" width="3" height="1" fill="#FF4444"/>
</svg>

  <rect x="7" y="18" width="1" height="1" fill="#C8A030"/>
  <rect x="8" y="18" width="16" height="1" fill="#E8C840"/>
  <rect x="24" y="18" width="1" height="1" fill="#C8A030"/>
  <rect x="8" y="19" width="16" height="1" fill="#C8A030"/>


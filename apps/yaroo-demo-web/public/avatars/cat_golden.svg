  <rect x="3" y="9" width="1" height="3" fill="#2C3E50"/>
  <rect x="4" y="12" width="2" height="2" fill="#444"/>
  <rect x="26" y="8" width="2" height="4" fill="#2C3E50"/>
  <rect x="28" y="9" width="1" height="3" fill="#2C3E50"/>
  <rect x="26" y="12" width="2" height="2" fill="#444"/>

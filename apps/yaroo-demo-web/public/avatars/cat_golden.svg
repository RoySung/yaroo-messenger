  <rect x="5" y="21" width="22" height="2" fill="#3B7AC0"/>
  <rect x="4" y="23" width="24" height="2" fill="#FFFFFF"/>
  <rect x="4" y="25" width="24" height="2" fill="#3B7AC0"/>
  <rect x="4" y="27" width="24" height="2" fill="#FFFFFF"/>
  <rect x="4" y="29" width="24" height="3" fill="#3B7AC0"/>

